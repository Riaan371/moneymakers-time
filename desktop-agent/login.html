<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; padding: 24px; background: #f8fafc; margin: 0; }
  h1 { font-size: 16px; margin: 0 0 4px; color: #0f172a; }
  p { font-size: 12px; color: #64748b; margin: 0 0 16px; }
  label { display: block; font-size: 12px; font-weight: 600; margin-top: 10px; color: #334155; }
  input {
    width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px;
    border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;
  }
  button {
    margin-top: 16px; width: 100%; padding: 9px; background: #047857; color: white;
    border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #error { color: #dc2626; font-size: 12px; margin-top: 8px; min-height: 14px; }
</style>
</head>
<body>
  <h1>MoneyMakers Tracker</h1>
  <p>Sign in with your Money Makers Time account. This runs in the background and syncs captured activity for review in the web app.</p>
  <form id="f">
    <label>Email</label>
    <input id="email" type="email" required autocomplete="username" />
    <label>Password</label>
    <input id="password" type="password" required autocomplete="current-password" />
    <div id="error"></div>
    <button id="submit" type="submit">Sign in</button>
  </form>
  <script>
    const { invoke } = window.__TAURI__.core;
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submit');
      const err = document.getElementById('error');
      btn.disabled = true;
      err.textContent = '';
      try {
        await invoke('sign_in', { email, password });
      } catch (ex) {
        err.textContent = typeof ex === 'string' ? ex : 'Sign in failed.';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
