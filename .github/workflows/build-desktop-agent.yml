name: Build Desktop Agent

on:
  push:
    branches: [main]
    paths:
      - 'desktop-agent/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-agent
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-agent -> target

      - name: Install Tauri CLI (cached)
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: tauri-cli@^2.0

      - name: Generate app icons
        run: cargo tauri icon icons/source-icon.png

      - name: Build installer
        run: cargo tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: moneymakers-tracker-windows-installer
          path: |
            desktop-agent/target/release/bundle/nsis/*.exe
            desktop-agent/target/release/bundle/msi/*.msi
