name: Build Desktop Agent

on:
  push:
    branches: [main]
    paths:
      - 'desktop-agent/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-agent
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-agent -> target

      - name: Install Tauri CLI (cached)
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: tauri-cli@^2.0

      - name: Generate app icons
        run: cargo tauri icon icons/source-icon.png

      - name: Build installer
        run: cargo tauri build

      - name: Assemble staff rollout package
        shell: bash
        run: |
          mkdir -p ../rollout-package
          cp target/release/bundle/nsis/*.exe ../rollout-package/ || true
          cp target/release/bundle/msi/*.msi ../rollout-package/ || true
          cp install-on-staff-pc.bat ../rollout-package/

      - name: Upload staff rollout package
        uses: actions/upload-artifact@v4
        with:
          name: moneymakers-tracker-staff-rollout
          path: rollout-package/
